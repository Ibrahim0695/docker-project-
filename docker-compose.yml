services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in your local environment}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in your local environment}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your local environment}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in your local environment}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in your local environment}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your local environment}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    restart: on-failure

volumes:
  db-data:
